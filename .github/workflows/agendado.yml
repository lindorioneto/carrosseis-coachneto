name: Publicar pela agenda

# Roda sozinho nos servidores do GitHub, segunda, quarta e sexta as 15h UTC
# = 11h em Cuiaba. Nao depende do computador do Lindorio estar ligado.
#
# Le agenda.json, renderiza as artes do post do dia, guarda no repositorio e
# publica no Instagram.
#
# O portao de aprovacao e a agenda: so entra em agenda.json post que o Lindorio
# ja aprovou, slide por slide, na conversa. Nada chega aqui sem esse "ok".
#
# Publicar so acontece no horario agendado (event_name == schedule). Se alguem
# rodar este workflow pelo botao, ele apenas gera as artes, sem publicar.

on:
  schedule:
    - cron: "0 15 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: O que a agenda manda publicar hoje
        id: hoje
        run: |
          POST="$(python agenda.py)"
          if [ -z "$POST" ]; then
            echo "Nada agendado para hoje ($(date -u +%F)). Encerrando sem fazer nada."
          else
            echo "Agendado para hoje: $POST"
          fi
          echo "post=$POST" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        if: steps.hoje.outputs.post != ''
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Baixar as fontes
        if: steps.hoje.outputs.post != ''
        run: |
          mkdir -p fonts
          for p in archivo ibm-plex-sans ibm-plex-mono; do
            npm pack @fontsource/$p --silent > /dev/null
            tar xzf fontsource-$p-*.tgz
            cp package/files/$p-latin-*00-normal.woff2 fonts/
            rm -rf package fontsource-$p-*.tgz
          done

      - name: Gerar as artes
        if: steps.hoje.outputs.post != ''
        run: python render.py "${{ steps.hoje.outputs.post }}"

      - name: Guardar as artes no repositorio
        id: media
        if: steps.hoje.outputs.post != ''
        run: |
          git config user.name  "coachneto-bot"
          git config user.email "actions@github.com"
          git add media
          if git diff --cached --quiet; then
            echo "Nenhuma arte mudou; reaproveitando as que ja estao no repositorio."
          else
            git commit -m "artes geradas pela agenda: ${{ steps.hoje.outputs.post }}"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Esperar o CDN do GitHub servir as artes
        if: steps.hoje.outputs.post != '' && github.event_name == 'schedule'
        run: sleep 30

      - name: Publicar no Instagram
        if: steps.hoje.outputs.post != '' && github.event_name == 'schedule'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MEDIA_REF: ${{ steps.media.outputs.sha }}
          MODO: publicar
        run: python publicar.py "${{ steps.hoje.outputs.post }}"

      - name: Guardar as artes como anexo da execucao
        if: steps.hoje.outputs.post != ''
        uses: actions/upload-artifact@v4
        with:
          name: artes
          path: media/
