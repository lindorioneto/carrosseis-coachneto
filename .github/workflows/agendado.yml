name: Gerar as artes pela agenda

# Roda sozinho no GitHub, segunda, quarta e sexta as 15h UTC = 11h em Cuiaba.
# Le agenda.json, renderiza as artes do post do dia e para por ai.
# NAO publica: este workflow nao recebe o segredo IG_TOKEN.
# Quem decide publicar e o Lindorio, depois de ver as artes.

on:
  schedule:
    - cron: "0 15 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: O que a agenda manda gerar hoje
        id: hoje
        run: |
          POST="$(python agenda.py)"
          if [ -z "$POST" ]; then
            echo "Nada agendado para hoje ($(date -u +%F)). Encerrando sem fazer nada."
          else
            echo "Agendado para hoje: $POST"
          fi
          echo "post=$POST" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        if: steps.hoje.outputs.post != ''
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Baixar as fontes
        if: steps.hoje.outputs.post != ''
        run: |
          mkdir -p fonts
          for p in archivo ibm-plex-sans ibm-plex-mono; do
            npm pack @fontsource/$p --silent > /dev/null
            tar xzf fontsource-$p-*.tgz
            cp package/files/$p-latin-*00-normal.woff2 fonts/
            rm -rf package fontsource-$p-*.tgz
          done

      - name: Gerar as artes
        if: steps.hoje.outputs.post != ''
        run: python render.py "${{ steps.hoje.outputs.post }}"

      - name: Guardar as artes no repositorio
        if: steps.hoje.outputs.post != ''
        run: |
          git config user.name  "coachneto-bot"
          git config user.email "actions@github.com"
          git add media
          if git diff --cached --quiet; then
            echo "Nenhuma arte mudou."
          else
            git commit -m "artes geradas pela agenda: ${{ steps.hoje.outputs.post }}"
            git push
          fi

      - name: Guardar as artes como anexo da execucao
        if: steps.hoje.outputs.post != ''
        uses: actions/upload-artifact@v4
        with:
          name: artes
          path: media/
